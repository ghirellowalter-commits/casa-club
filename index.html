<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<title>CASA CLUB — La casa è una squadra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  color-scheme:light;
  --bg:#f6f2ec;--surface:#fffdf9;--surface-2:#f0ebe3;
  --text:#252824;--muted:#85877f;--line:#e9e3da;
  --coral:#df806d;--coral-soft:#f8e5df;
  --sage:#879b83;--sage-soft:#e8eee5;
  --lilac:#a69abd;--lilac-soft:#eeeaf5;
  --blue:#7196a0;--blue-soft:#e5eef0;
  --mustard:#d2a64f;--mustard-soft:#f6efd9;
  --shadow:0 8px 28px rgba(48,43,34,.055);
  --radius:22px;
}
[data-theme="dark"] {
  color-scheme:dark;
  --bg:#171d1d;--surface:#222b2a;--surface-2:#2c3634;
  --text:#f3f0e9;--muted:#a3aaa2;--line:#394441;
  --coral:#e48d79;--coral-soft:#49332f;
  --sage:#9caf94;--sage-soft:#303e35;
  --lilac:#b9add1;--lilac-soft:#3b3549;
  --blue:#8bb2bb;--blue-soft:#2e4146;
  --mustard:#e0b85e;--mustard-soft:#453d29;
  --shadow:0 8px 28px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}
.app-shell{min-height:100vh;padding-bottom:100px}
.topbar{max-width:1100px;margin:auto;padding:22px 24px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;background:var(--coral);color:white;font-size:21px;box-shadow:0 5px 14px rgba(223,128,109,.2)}
.brand-name{font-size:17px;font-weight:900;letter-spacing:1.4px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.5px}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:15px;display:grid;place-items:center;font-size:18px}
.user-chip{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;background:var(--surface);border:1px solid var(--line);border-radius:30px;font-size:12px;font-weight:700}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral);font-weight:900;font-size:12px}
.main{max-width:1100px;margin:auto;padding:8px 24px 30px}
.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:15px 0 24px}
.page-heading h1{font-size:clamp(27px,5vw,39px);line-height:1.08;letter-spacing:-1.6px;margin:7px 0 5px;font-weight:850}
.page-heading p{margin:0;color:var(--muted);font-size:13px}
.section{margin:27px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.section-head h2{font-size:17px;letter-spacing:-.4px;margin:0}
.section-head span{font-size:11px;color:var(--muted)}
.grid{display:grid;gap:13px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;margin:0 0 6px;letter-spacing:-.3px}
.card p{margin:0;color:var(--muted);font-size:12px}
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:27px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-85px;background:var(--coral-soft);opacity:.9}
.hero-content{position:relative;z-index:1;max-width:600px}
.hero h1{font-size:clamp(29px,6vw,45px);line-height:1.05;letter-spacing:-1.8px;margin:10px 0}
.hero p{color:var(--muted);font-size:13px;margin:0 0 18px}
.hero .hero-tag{display:inline-flex;padding:6px 10px;border-radius:30px;background:var(--sage-soft);color:var(--sage);font-size:10px;font-weight:800;letter-spacing:1px}
.stat-card{padding:18px;min-height:120px}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;font-size:17px}
.stat-value{font-size:30px;font-weight:850;letter-spacing:-1.3px;margin-top:13px}
.stat-label{font-size:11px;color:var(--muted);font-weight:650}
.coral{background:var(--coral-soft);color:var(--coral)}
.sage{background:var(--sage-soft);color:var(--sage)}
.lilac{background:var(--lilac-soft);color:var(--lilac)}
.blue{background:var(--blue-soft);color:var(--blue)}
.mustard{background:var(--mustard-soft);color:var(--mustard)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-size:12px;font-weight:800;background:var(--text);color:var(--surface);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--coral);color:white}
.btn-soft{background:var(--coral-soft);color:var(--coral)}
.btn-neutral{background:var(--surface-2);color:var(--text)}
.btn-danger{background:#b95d58;color:white}
.btn-small{padding:8px 11px;font-size:11px;border-radius:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.form-card{max-width:650px}
.field{margin:13px 0}
.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:13px;padding:12px 13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.field textarea{min-height:75px;resize:vertical}
.task-card{position:relative;overflow:hidden}
.task-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--task-color,var(--sage))}
.task-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task-title{font-size:14px;font-weight:800}
.task-description{font-size:12px;color:var(--muted);margin-top:5px}
.points{white-space:nowrap;padding:6px 9px;border-radius:20px;background:var(--mustard-soft);color:var(--mustard);font-size:11px;font-weight:900}
.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.pill.pending{background:var(--mustard-soft);color:var(--mustard)}
.pill.approved{background:var(--sage-soft);color:var(--sage)}
.pill.rejected{background:var(--coral-soft);color:var(--coral)}
.pill.partial{background:var(--lilac-soft);color:var(--lilac)}
.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.task-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.progress{height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden;margin-top:11px}
.progress>span{display:block;height:100%;border-radius:20px;background:var(--coral);transition:width .3s}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-main{min-width:0}
.list-main strong{font-size:13px;display:block}
.list-main small{font-size:11px;color:var(--muted)}
.score{font-size:18px;font-weight:900;letter-spacing:-.5px;white-space:nowrap}
.rank-number{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-weight:900;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav-inner{max-width:680px;margin:auto;display:flex;justify-content:space-around;gap:4px}
.nav-item{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 10px;border-radius:14px;font-size:9px;font-weight:800;min-width:54px}
.nav-item .nav-icon{font-size:19px;line-height:1}
.nav-item.active{background:var(--coral-soft);color:var(--coral)}
.empty{text-align:center;padding:28px 15px;color:var(--muted)}
.empty-icon{font-size:28px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:95px;z-index:50;transform:translate(-50%,20px);background:var(--text);color:var(--surface);padding:12px 17px;border-radius:14px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}
.login-logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--coral);color:white;font-size:26px;margin-bottom:23px}
.login-card h1{font-size:29px;letter-spacing:-1px;margin:0 0 5px}
.login-card>p{color:var(--muted);font-size:13px;margin:0 0 22px}
.loading{padding:50px;text-align:center;color:var(--muted)}
.spinner{width:25px;height:25px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.notice{padding:12px 14px;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:11px;margin:12px 0}
@media(max-width:650px){
  .topbar{padding:15px 16px 10px}
  .main{padding:7px 16px 25px}
  .brand-name{font-size:15px}
  .user-chip{padding:6px 9px 6px 6px}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:22px}
  .card{padding:16px;border-radius:19px}
  .stat-card{min-height:108px}
  .page-heading{margin:12px 0 20px}
  .nav-item{min-width:0;flex:1;padding:8px 3px}
}
@media(max-width:370px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .user-chip span:last-child{display:none}
}
</style>
</head>

<body>
<div id="root">
  <div class="loading"><div class="spinner"></div>Caricamento CASA CLUB…</div>
</div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://bdftsbhfomlowpoxihgp.supabase.co";
const SUPABASE_KEY = "sb_publishable_yNVMFohrVcCdPm_tMkIj2Q_xJM8eS5C";
const FAMILY_ID = "034db486-32d2-4919-8f5c-596d7c2b787a";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
let me = null;
let familyMembers = [];
let tasks = [];
let completions = [];
let rewards = [];
let ledger = [];
let redemptions = [];
let currentPage = "home";
let loading = false;
let editingTask = null;
let editingReward = null;
let refreshTimer = null;

const root = document.getElementById("root");

const categories = {
  cucina:"Cucina",
  pulizie:"Pulizie",
  ordine:"Ordine",
  bucato:"Bucato",
  spesa:"Spesa",
  cura:"Cura della casa",
  altro:"Altro"
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>el.classList.remove("show"),2800);
}

function initials(name) {
  return (name || "?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function memberName(id) {
  return familyMembers.find(m=>m.id===id)?.display_name || "Familiare";
}

function moneyPoints(value) {
  return `${Number(value || 0)} pt`;
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("casa-club-theme",theme);
  const button = document.getElementById("themeToggle");
  if(button) button.textContent = theme === "dark" ? "☀" : "☾";
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  setTheme(next);
}

setTheme(localStorage.getItem("casa-club-theme") || "light");

async function runAction(action, successMessage) {
  try {
    loading = true;
    await action();
    if(successMessage) toast(successMessage);
    await loadData();
  } catch(error) {
    console.error(error);
    toast(error.message || "Si è verificato un errore");
  } finally {
    loading = false;
  }
}

async function loadData() {
  if(!session || !me) return;

  const [t,c,r,l,m,rd] = await Promise.all([
    db.from("tasks").select("*").eq("family_id",FAMILY_ID).order("created_at",{ascending:false}),
    db.from("completions").select("*").eq("family_id",FAMILY_ID).order("submitted_at",{ascending:false}),
    db.from("rewards").select("*").eq("family_id",FAMILY_ID).order("created_at",{ascending:false}),
    db.from("points_ledger").select("*").eq("family_id",FAMILY_ID).order("created_at",{ascending:false}),
    db.from("members").select("*").eq("family_id",FAMILY_ID),
    db.from("redemptions").select("*").eq("family_id",FAMILY_ID).order("created_at",{ascending:false})
  ]);

  for(const result of [t,c,r,l,m,rd]) {
    if(result.error) throw result.error;
  }

  tasks = t.data || [];
  completions = c.data || [];
  rewards = r.data || [];
  ledger = l.data || [];
  familyMembers = m.data || [];
  redemptions = rd.data || [];

  render();
}

async function loadMember() {
  const {data,error} = await db.from("members")
    .select("*").eq("auth_user_id",session.user.id)
    .eq("family_id",FAMILY_ID).maybeSingle();

  if(error) throw error;
  if(!data) throw new Error("Questo account non risulta associato a CASA CLUB.");
  me = data;
}

function balance(memberId) {
  return ledger.filter(x=>x.member_id===memberId)
    .reduce((sum,x)=>sum+Number(x.points || 0),0);
}

function reservedPoints(memberId) {
  return redemptions
    .filter(r=>r.member_id===memberId && r.status==="pending")
    .reduce((sum,r)=>sum+Number(r.points_cost || 0),0);
}

function availableBalance(memberId) {
  return balance(memberId)-reservedPoints(memberId);
}

function myPending() {
  return completions.filter(c=>c.status==="pending" && c.reviewer_member_id===me.id);
}

function myPendingRedemptions() {
  return redemptions.filter(r=>r.status==="pending" && r.reviewer_member_id===me.id);
}

function myTasks() {
  return tasks.filter(t=>t.is_active && t.target_type===me.role &&
    (!t.assigned_member_id || t.assigned_member_id===me.id));
}

function pageTitle() {
  return {
    home:["Bentornato","La casa è una squadra. Ogni gesto conta."],
    tasks:["Le faccende","Piccoli gesti, grandi risultati."],
    reviews:["Da confermare","Ogni contributo merita attenzione."],
    ranking:["La classifica","Una squadra, tanti piccoli traguardi."],
    rewards:["I premi","I punti diventano momenti speciali."],
    settings:["Impostazioni","Gestisci CASA CLUB."]
  }[currentPage];
}

function render() {
  if(!session || !me) return renderLogin();

  const [title,subtitle] = pageTitle();
  const reviewCount = myPending().length + myPendingRedemptions().length;

  root.innerHTML = `
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">⌂</div>
          <div>
            <div class="brand-name">CASA CLUB</div>
            <div class="brand-sub">LA CASA È UNA SQUADRA</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Cambia tema" onclick="toggleTheme()">☾</button>
          <div class="user-chip">
            <div class="avatar">${esc(initials(me.display_name))}</div>
            <span>${esc(me.display_name)}</span>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="page-heading">
          <div>
            <div class="eyebrow">CASA CLUB / ${esc(title)}</div>
            <h1>${esc(title)}</h1>
            <p>${esc(subtitle)}</p>
          </div>
        </div>
        <div id="pageContent">${renderPage()}</div>
      </main>

      <nav class="bottom-nav">
        <div class="nav-inner">
          ${navItem("home","⌂","Home")}
          ${navItem("tasks","✳","Faccende")}
          ${navItem("reviews","✓","Conferme",reviewCount)}
          ${navItem("ranking","↗","Classifica")}
          ${navItem("rewards","◇","Premi")}
          ${navItem("settings","•••","Altro")}
        </div>
      </nav>
    </div>
  `;

  setTheme(document.documentElement.dataset.theme || "light");
}

function navItem(page,icon,label,count=0) {
  return `<button class="nav-item ${currentPage===page?"active":""}" data-page="${page}">
    <span class="nav-icon">${icon}${count?`<sup style="font-size:9px;color:var(--coral)">${count}</sup>`:""}</span>
    <span>${label}</span>
  </button>`;
}

function renderPage() {
  switch(currentPage) {
    case "home": return renderHome();
    case "tasks": return renderTasks();
    case "reviews": return renderReviews();
    case "ranking": return renderRanking();
    case "rewards": return renderRewards();
    case "settings": return renderSettings();
    default: return renderHome();
  }
}

function renderHome() {
  const myBalance = availableBalance(me.id);
  const pending = completions.filter(c=>c.performed_by===me.id && c.status==="pending").length;
  const approved = completions.filter(c=>c.performed_by===me.id && c.status==="approved").length;
  const available = myTasks().length;
  const waiting = myPending().length + myPendingRedemptions().length;
  const recent = completions.filter(c=>c.performed_by===me.id).slice(0,4);

  return `
    <section class="hero">
      <div class="hero-content">
        <span class="hero-tag">IL TUO SPAZIO DI CASA</span>
        <h1>Ciao ${esc(me.display_name)}.<br>Facciamo squadra?</h1>
        <p>Ogni gesto conta. Scegli un'attività, completa il tuo contributo e costruisci insieme una casa più serena.</p>
        <button class="btn btn-primary" data-page="tasks">Scopri le faccende →</button>
      </div>
    </section>

    <section class="section">
      <div class="grid grid-3">
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">PUNTI DISPONIBILI</span><span class="stat-icon mustard">✦</span></div>
          <div class="stat-value">${myBalance}</div>
          <div class="stat-label">punti utilizzabili</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">IN ATTESA</span><span class="stat-icon coral">◷</span></div>
          <div class="stat-value">${pending}</div>
          <div class="stat-label">attività da confermare</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top"><span class="stat-label">COMPLETATE</span><span class="stat-icon sage">✓</span></div>
          <div class="stat-value">${approved}</div>
          <div class="stat-label">attività approvate</div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>La tua giornata</h2><span>${available} attività disponibili</span></div>
      <div class="grid grid-2">
        <div class="card">
          <div class="stat-icon blue">✳</div>
          <h3 style="margin-top:12px">Fai la tua parte</h3>
          <p>Scopri le attività e scegli da dove iniziare.</p>
          <div class="btn-row"><button class="btn btn-soft btn-small" data-page="tasks">Vai alle faccende</button></div>
        </div>
        <div class="card">
          <div class="stat-icon lilac">✓</div>
          <h3 style="margin-top:12px">Conferme da gestire</h3>
          <p>${waiting ? `${waiting} richieste aspettano la tua revisione.` : "Non hai conferme in sospeso."}</p>
          <div class="btn-row"><button class="btn btn-neutral btn-small" data-page="reviews">Apri conferme</button></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Le tue ultime attività</h2><span>Recenti</span></div>
      <div class="card">
        ${recent.length ? recent.map(c=>completionRow(c)).join("") : emptyState("✦","Il tuo percorso inizia qui","Completa una faccenda per vedere i tuoi progressi.")}
      </div>
    </section>
  `;
}

function emptyState(icon,title,description) {

async function login(form) {
  const data = new FormData(form);
  const {error} = await db.auth.signInWithPassword({
    email:data.get("email"),
    password:data.get("password")
  });
  if(error) {
    document.getElementById("loginError").textContent = error.message;
    return;
  }
  await startApp();
}

async function startApp() {
  const {data} = await db.auth.getSession();
  session = data.session;
  if(!session) return renderLogin();

  try {
    await loadMember();
    await loadData();
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(()=>loadData().catch(console.error),30000);
  } catch(error) {
    console.error(error);
    root.innerHTML = `<div class="login-screen"><div class="login-card"><h2>Accesso non completato</h2><p>${esc(error.message)}</p><button class="btn btn-primary" onclick="logout()">Esci e riprova</button></div></div>`;
  }
}

async function logout() {
  if(refreshTimer) clearInterval(refreshTimer);
  await db.auth.signOut();
  session=null;me=null;
  tasks=[];completions=[];rewards=[];ledger=[];redemptions=[];
  renderLogin();
}

async function submitTask(taskId) {
  const task = tasks.find(t=>t.id===taskId);
  if(!task) return;
  await runAction(async()=>{
    const {error} = await db.rpc("submit_completion",{p_task_id:taskId});
    if(error) throw error;
  },"Attività inviata per la conferma!");
}

async function reviewTask(id,decision) {
  let note = "";
  if(decision==="partial" || decision==="rejected") {
    note = prompt(decision==="partial"?"Cosa manca da completare?":"Motivo del rifiuto:") || "";
    if(!note.trim()) {toast("Inserisci una breve motivazione.");return;}
  }
  await runAction(async()=>{
    const {error} = await db.rpc("review_completion",{
      p_completion_id:id,
      p_decision:decision,
      p_note:note
    });
    if(error) throw error;
  },decision==="approved"?"Attività approvata!":"Revisione registrata.");
}

async function requestRedemption(rewardId) {
  const reward=rewards.find(r=>r.id===rewardId);
  if(!reward) return;
  if(availableBalance(me.id)<Number(reward.points_cost)) {
    toast("Punti disponibili insufficienti.");
    return;
  }
  const confirmed=confirm(`Vuoi richiedere "${reward.title}" per ${Number(reward.points_cost)} punti?`);
  if(!confirmed) return;

  await runAction(async()=>{
    const {error}=await db.rpc("request_redemption",{p_reward_id:rewardId});
    if(error) throw error;
  },"Richiesta premio inviata!");
}

async function reviewRedemption(id,decision) {
  let note="";
  if(decision==="rejected") {
    note=prompt("Motivo del rifiuto:")||"";
    if(!note.trim()) {
      toast("Inserisci una breve motivazione.");
      return;
    }
  }

  const message=decision==="approved"
    ?"Confermi l'approvazione del riscatto? I punti verranno detratti."
    :"Confermi il rifiuto della richiesta?";
  if(!confirm(message)) return;

  await runAction(async()=>{
    const {error}=await db.rpc("review_redemption",{
      p_redemption_id:id,
      p_decision:decision,
      p_note:note
    });
    if(error) throw error;
  },decision==="approved"?"Riscatto approvato e punti detratti!":"Richiesta di riscatto rifiutata.");
}

async function createOrUpdateTask(form) {
  const d = new FormData(form);
  const args = {
    p_title:String(d.get("title")).trim(),
    p_category:d.get("category") || null,
    p_description:String(d.get("description")||"").trim() || null,
    p_points:Number(d.get("points")),
    p_target_type:d.get("target_type") || "adult",
    p_assigned_member_id:d.get("assigned_member_id") || null
  };

  await runAction(async()=>{
    let result;
    if(editingTask) {
      result = await db.rpc("update_task",{
        p_task_id:editingTask,
        p_title:args.p_title,
        p_category:args.p_category,
        p_description:args.p_description,
        p_points:args.p_points,
        p_assigned_member_id:args.p_assigned_member_id
      });
    } else {
      result = await db.rpc("create_task",args);
    }
    if(result.error) throw result.error;
    editingTask=null;
  },editingTask?"Attività aggiornata!":"Attività creata!");
}

async function toggleTask(id,active) {
  await runAction(async()=>{
    const {error} = await db.rpc("set_task_active",{p_task_id:id,p_is_active:active});
    if(error) throw error;
  },active?"Attività attivata":"Attività sospesa");
}

async function createOrUpdateReward(form) {
  const d = new FormData(form);
  const args = {
    p_title:String(d.get("title")).trim(),
    p_description:String(d.get("description")||"").trim() || null,
    p_points_cost:Number(d.get("points_cost"))
  };

  const wasEditing=Boolean(editingReward);

  await runAction(async()=>{
    let result;
    if(wasEditing) {
      result = await db.rpc("update_reward",{
        p_reward_id:editingReward,
        ...args
      });
    } else {
      result = await db.rpc("create_reward",{
        ...args,
        p_target_type:d.get("target_type") || "adult"
      });
    }
    if(result.error) throw result.error;
    editingReward=null;
  },wasEditing?"Premio aggiornato!":"Premio creato!");
}

async function toggleReward(id,active) {
  await runAction(async()=>{
    const {error} = await db.rpc("set_reward_active",{p_reward_id:id,p_is_active:active});
    if(error) throw error;
  },active?"Premio attivato":"Premio sospeso");
}

document.addEventListener("click",async event=>{
  const pageButton = event.target.closest("[data-page]");
  if(pageButton) {
    currentPage=pageButton.dataset.page;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }

  const button = event.target.closest("[data-action]");
  if(!button) return;

  const action=button.dataset.action;
  const id=button.dataset.id;

  try {
    if(action==="new-task") taskForm();
    if(action==="edit-task") taskForm(tasks.find(t=>t.id===id));
    if(action==="close-task-form") {
      editingTask=null;
      document.getElementById("taskFormSlot").innerHTML="";
    }
    if(action==="submit-task") await submitTask(id);
    if(action==="toggle-task") await toggleTask(id,button.dataset.active==="true");
    if(action==="review") await reviewTask(id,button.dataset.decision);

    if(action==="request-redemption") await requestRedemption(id);
    if(action==="review-redemption") await reviewRedemption(id,button.dataset.decision);

    if(action==="new-reward") rewardForm();
    if(action==="edit-reward") rewardForm(rewards.find(r=>r.id===id));
    if(action==="close-reward-form") {
      editingReward=null;
      document.getElementById("rewardFormSlot").innerHTML="";
    }
    if(action==="toggle-reward") await toggleReward(id,button.dataset.active==="true");
    if(action==="logout") await logout();
    if(action==="refresh") await runAction(async()=>{}, "Dati aggiornati");
  } catch(error) {
    console.error(error);
    toast(error.message || "Operazione non riuscita");
  }
});

document.addEventListener("submit",async event=>{
  if(event.target.id==="loginForm") {
    event.preventDefault();
    const button=event.target.querySelector('button[type="submit"]');
    button.disabled=true;
    button.textContent="Accesso…";
    try {await login(event.target);}
    catch(error) {
      const errorEl=document.getElementById("loginError");
      if(errorEl) errorEl.textContent=error.message;
    } finally {
      if(button.isConnected) {
        button.disabled=false;
        button.textContent="Accedi →";
      }
    }
  }

  if(event.target.id==="taskForm") {
    event.preventDefault();
    await createOrUpdateTask(event.target);
  }

  if(event.target.id==="rewardForm") {
    event.preventDefault();
    await createOrUpdateReward(event.target);
  }
});

db.auth.onAuthStateChange((_event,newSession)=>{
  session=newSession;
  if(newSession && !me) {
    setTimeout(()=>startApp(),0);
  } else if(!newSession) {
    me=null;
    renderLogin();
  }
});

startApp();
</script>
