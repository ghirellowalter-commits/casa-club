<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<title>CASA CLUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg:#f5f2ec;--card:#fffefa;--surface:#eeece5;--ink:#273631;
--muted:#77827c;--green:#315f59;--green-light:#e1ece7;
--teal:#78a99a;--coral:#d98d79;--coral-light:#f7e8e2;
--gold:#c49a4e;--gold-light:#f5eddc;--lilac:#9589b8;
--lilac-light:#eeeaf5;--red:#ad5550;--border:#e5e4dc;
--radius:20px;--shadow:0 8px 28px #283b3010;
}
:root[data-theme="dark"]{
--bg:#202a29;--card:#293533;--surface:#34413e;--ink:#f1f0e9;
--muted:#b0bbb4;--green:#8bb8a6;--green-light:#354b43;
--teal:#8ab9ab;--coral:#e2a18e;--coral-light:#503c38;
--gold:#dfbd79;--gold-light:#4a4231;--lilac:#b2a6d2;
--lilac-light:#403b50;--red:#e08d85;--border:#40504b;
--shadow:0 8px 28px #0003;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--ink);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
transition:background .2s,color .2s
}
button,input,select,textarea{font:inherit}
button{
cursor:pointer;border:0;border-radius:13px;padding:12px 16px;
background:var(--green);color:white;font-weight:700;
transition:transform .15s,opacity .15s
}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--green-light);color:var(--green)}
.btn-coral{background:var(--coral-light);color:var(--coral)}
.btn-danger{background:var(--coral-light);color:var(--red)}
.btn-gold{background:var(--gold-light);color:var(--gold)}
.btn-small{padding:9px 12px;font-size:13px}
header,main,.nav{max-width:900px;margin:auto}
header{padding:24px 18px 12px}
.brand{display:flex;align-items:center;gap:13px}
.logo{
width:48px;height:48px;border-radius:16px;display:grid;
place-items:center;background:var(--green);color:white;
font-size:24px;font-weight:800;flex-shrink:0
}
h1{font-size:22px;letter-spacing:1.5px;margin:0}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 7px}
p{line-height:1.5}
.tagline,.sub{color:var(--muted);font-size:13px}
.tagline{margin-top:4px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-actions{display:flex;gap:8px}
main{padding:12px 16px 115px}
.card{
background:var(--card);border:1px solid var(--border);
border-radius:var(--radius);padding:18px;margin:12px 0;
box-shadow:var(--shadow)
}
.welcome{
padding:24px;border-radius:24px;
background:linear-gradient(125deg,var(--green-light),var(--card));
margin:8px 0 17px;box-shadow:var(--shadow)
}
.eyebrow{
font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
color:var(--muted);font-weight:800
}
.welcome h2{font-size:26px;margin:9px 0}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stat{
background:var(--card);border:1px solid var(--border);
border-radius:17px;padding:14px 11px;box-shadow:var(--shadow)
}
.stat strong{display:block;font-size:23px;margin-bottom:4px}
.stat span{font-size:11px;color:var(--muted)}
.section-head{
display:flex;align-items:center;justify-content:space-between;
gap:10px;margin:23px 2px 11px
}
.section-head h2{margin:0}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:12px 0 6px}
input,select,textarea{
width:100%;padding:12px;border:1px solid var(--border);
border-radius:12px;background:var(--bg);color:var(--ink);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:75px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{
display:inline-block;padding:5px 10px;border-radius:20px;
font-size:11px;font-weight:750;background:var(--surface);color:var(--muted)
}
.pending,.partial{background:var(--gold-light);color:var(--gold)}
.approved{background:var(--green-light);color:var(--green)}
.rejected{background:var(--coral-light);color:var(--red)}
.points{font-weight:800;color:var(--gold);white-space:nowrap}
.member-row{padding:12px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border:0}
.empty{
color:var(--muted);font-size:14px;padding:18px;
text-align:center;border:1px dashed var(--border);
border-radius:15px
}
.hidden{display:none!important}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.big-number{font-size:30px;font-weight:800;margin:8px 0;color:var(--green)}
.nav{
position:fixed;bottom:0;left:0;right:0;display:flex;
justify-content:space-around;background:var(--card);
border-top:1px solid var(--border);
padding:8px 4px max(8px,env(safe-area-inset-bottom));
z-index:10;backdrop-filter:blur(12px)
}
.nav button{
background:transparent;color:var(--muted);padding:7px 3px;
min-width:0;flex:1;display:flex;flex-direction:column;
align-items:center;gap:3px;font-size:19px;border-radius:12px
}
.nav button small{font-size:10px;font-weight:650}
.nav button.active{background:var(--green-light);color:var(--green)}
.theme-toggle{
width:40px;height:40px;padding:0;border-radius:13px;
background:var(--surface);color:var(--ink);font-size:19px
}
.theme-choice{display:flex;gap:8px}
.theme-choice button{flex:1}
.notice{
padding:12px 14px;border-radius:13px;background:var(--gold-light);
color:var(--gold);font-size:13px;line-height:1.5;margin:12px 0
}
#message{
position:fixed;top:14px;left:12px;right:12px;max-width:500px;
margin:auto;z-index:30;padding:13px 16px;border-radius:13px;
background:var(--ink);color:var(--card);box-shadow:var(--shadow);
display:none;font-size:13px
}
#login{max-width:440px;margin:35px auto;padding:16px}
#login .card{padding:24px}
.rank-number{
width:36px;height:36px;border-radius:12px;
display:grid;place-items:center;background:var(--green-light);
color:var(--green);font-weight:800
}
@media(min-width:650px){
.nav{position:static;margin:10px auto;border:1px solid var(--border);border-radius:16px}
.nav button{flex-direction:row;justify-content:center;gap:7px}
main{padding-bottom:35px}
.welcome{padding:30px}
.welcome h2{font-size:30px}
}
</style>
</head>
<body>
<div id="message"></div>

<div id="login" class="hidden">
 <div class="card">
  <div class="brand">
   <div class="logo">C</div>
   <div><h1>CASA CLUB</h1><div class="tagline">La casa è una squadra. Ogni gesto conta.</div></div>
  </div>
  <hr>
  <h2>Benvenuto!</h2>
  <form id="loginForm">
   <label>Email</label>
   <input id="email" type="email" autocomplete="username" required>
   <label>Password</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <div class="actions"><button type="submit" id="loginButton">Accedi</button></div>
   <p class="sub">Accedi con il tuo account familiare.</p>
  </form>
 </div>
</div>

<div id="application" class="hidden">
 <header>
  <div class="header-row">
   <div class="brand">
    <div class="logo">C</div>
    <div><h1>CASA CLUB</h1><div class="tagline">La casa è una squadra. Ogni gesto conta.</div></div>
   </div>
   <div class="header-actions">
    <button class="theme-toggle" id="themeToggle" title="Cambia tema" aria-label="Cambia tema">◐</button>
   </div>
  </div>
 </header>

 <nav class="nav" id="navigation">
  <button data-tab="home" class="active">⌂<small>Casa</small></button>
  <button data-tab="tasks">✓<small>Faccende</small></button>
  <button data-tab="reviews">▣<small>Conferme</small></button>
  <button data-tab="ranking">♛<small>Classifica</small></button>
  <button data-tab="rewards">◇<small>Premi</small></button>
  <button data-tab="settings">⚙<small>Altro</small></button>
 </nav>
 <main id="app"></main>
</div>

<script>
'use strict';

const SUPABASE_URL='https://bdftsbhfomlowpoxihgp.supabase.co';
const SUPABASE_KEY='sb_publishable_yNVMFohrVcCdPm_tMkIj2Q_xJM8eS5C';
const FAMILY_ID='034db486-32d2-4919-8f5c-596d7c2b787a';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let session=null,currentMember=null,members=[],tasks=[],completions=[],rewards=[],ledger=[];
let currentTab='home',busy=false,refreshTimer=null;
let theme=localStorage.getItem('casa-club-theme')||'light';
document.documentElement.dataset.theme=theme;

const $=id=>document.getElementById(id);

function esc(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}
function notify(message){
 const box=$('message');box.textContent=message;box.style.display='block';
 clearTimeout(notify.timer);notify.timer=setTimeout(()=>box.style.display='none',3500);
}
function setTheme(value){
 theme=value;localStorage.setItem('casa-club-theme',value);
 document.documentElement.dataset.theme=value;
}
function isAdult(){return currentMember?.role==='adult';}
function memberName(id){return members.find(m=>m.id===id)?.display_name||'Membro';}
function memberById(id){return members.find(m=>m.id===id)||null;}
function taskById(id){return tasks.find(t=>t.id===id)||null;}
function rewardById(id){return rewards.find(r=>r.id===id)||null;}
function pointsBalance(memberId){
 return ledger.filter(x=>x.member_id===memberId).reduce((sum,x)=>{
  const n=Number(x.points)||0;
  if(x.entry_type==='earn')return sum+n;
  if(x.entry_type==='redeem')return sum-n;
  if(x.entry_type==='adjustment')return sum+n;
  return sum;
 },0);
}
function statusLabel(status){
 return {pending:'In attesa',approved:'Approvata',partial:'Da completare',rejected:'Rifiutata'}[status]||status;
}

function showLogin(){
 $('application').classList.add('hidden');$('login').classList.remove('hidden');
}
function showApplication(){
 $('login').classList.add('hidden');$('application').classList.remove('hidden');
}
async function login(event){
 event.preventDefault();
 const button=$('loginButton');button.disabled=true;button.textContent='Accesso...';
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:$('email').value.trim(),password:$('password').value
  });
  if(error)throw error;
  session=data.session;await initialize();
 }catch(error){notify('Accesso non riuscito: '+error.message);}
 finally{button.disabled=false;button.textContent='Accedi';}
}
async function logout(){
 stopRefresh();
 const {error}=await db.auth.signOut();
 if(error){notify(error.message);return;}
 session=null;currentMember=null;showLogin();
}
async function checkSession(){
 const {data,error}=await db.auth.getSession();
 if(error)throw error;
 session=data.session;
 if(session)await initialize();else showLogin();
}

async function initialize(){
 showApplication();$('app').innerHTML='<div class="card">Caricamento CASA CLUB...</div>';
 try{
  const {data,error}=await db.from('members').select('*').eq('family_id',FAMILY_ID);
  if(error)throw error;
  members=data||[];
  currentMember=members.find(m=>m.auth_user_id===session.user.id);
  if(!currentMember)throw new Error('Account non associato alla famiglia CASA CLUB.');
  await loadData();render();startRefresh();
 }catch(error){
  $('app').innerHTML='<div class="card"><h2>Errore</h2><p>'+esc(error.message)+'</p><button id="retry">Riprova</button></div>';
  $('retry').onclick=initialize;
 }
}
async function loadData(){
 const results=await Promise.all([
  db.from('tasks').select('*').eq('family_id',FAMILY_ID).order('created_at',{ascending:false}),
  db.from('completions').select('*').eq('family_id',FAMILY_ID).order('submitted_at',{ascending:false}),
  db.from('rewards').select('*').eq('family_id',FAMILY_ID).order('created_at',{ascending:false}),
  db.from('points_ledger').select('*').eq('family_id',FAMILY_ID).order('created_at',{ascending:false})
 ]);
 const labels=['attività','conferme','premi','punti'];
 results.forEach((r,i)=>{if(r.error)throw new Error('Errore caricamento '+labels[i]+': '+r.error.message);});
 tasks=results[0].data||[];completions=results[1].data||[];
 rewards=results[2].data||[];ledger=results[3].data||[];
}
async function refreshData(){
 if(busy||!session)return;
 try{await loadData();render();}catch(error){notify('Aggiornamento non riuscito: '+error.message);}
}
function startRefresh(){stopRefresh();refreshTimer=setInterval(refreshData,30000);}
function stopRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=null;}

$('themeToggle').addEventListener('click',()=>{
 setTheme(theme==='light'?'dark':'light');
});
$('navigation').addEventListener('click',event=>{
 const button=event.target.closest('[data-tab]');if(!button)return;
 currentTab=button.dataset.tab;render();
});

function render(){
 if(!currentMember)return;
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));
 const pages={home:renderHome,tasks:renderTasksPage,reviews:renderReviewsPage,ranking:renderRankingPage,rewards:renderRewardsPage,settings:renderSettingsPage};
 $('app').innerHTML=pages[currentTab]();
}
function headerCard(){
 return `<div class="welcome">
  <div class="eyebrow">Benvenuto in CASA CLUB</div>
  <h2>Ciao, ${esc(currentMember.display_name)}.</h2>
  <p>Ogni piccolo gesto contribuisce a una casa più serena. La squadra funziona quando ognuno fa la sua parte.</p>
 </div>
 <div class="stats">
  <div class="stat"><strong>${pointsBalance(currentMember.id)}</strong><span>I tuoi punti</span></div>
  <div class="stat"><strong>${completions.filter(c=>c.performed_by===currentMember.id&&c.status==='approved').length}</strong><span>Attività approvate</span></div>
  <div class="stat"><strong>${completions.filter(c=>c.status==='pending'&&c.reviewer_member_id===currentMember.id).length}</strong><span>Da confermare</span></div>
 </div>`;
}
function myCompletions(){return completions.filter(c=>c.performed_by===currentMember.id);}
function renderHome(){
 const recent=completions.slice(0,5);
 const available=tasks.filter(t=>t.is_active&&t.target_type===currentMember.role&&(!t.assigned_member_id||t.assigned_member_id===currentMember.id));
 return headerCard()+`
 <div class="section-head"><h2>Le tue faccende</h2><button class="btn-secondary btn-small" data-tab="tasks">Vedi tutte</button></div>
 ${available.slice(0,3).map(taskCard).join('')||'<div class="empty">Non ci sono attività disponibili.</div>'}
 <div class="section-head"><h2>La nostra squadra</h2></div>
 <div class="card">${members.map(m=>`<div class="member-row row between"><strong>${esc(m.display_name)}</strong><strong>${pointsBalance(m.id)} punti</strong></div>`).join('')}</div>
 <div class="section-head"><h2>Ultimi aggiornamenti</h2></div>
 <div class="card">${recent.map(completionCard).join('')||'<p class="empty">Nessuna attività registrata.</p>'}</div>`;
}
function taskCard(t){
 const pending=completions.some(c=>c.task_id===t.id&&c.performed_by===currentMember.id&&c.status==='pending');
 return `<div class="card">
  <div class="row between"><div class="grow"><h3>${esc(t.title)}</h3><p class="sub">${esc(t.description||'')}</p><span class="pill">${esc(t.category||'Generale')}</span></div><span class="points">+${Number(t.points)||0} pt</span></div>
  <div class="actions"><button data-action="submit-task" data-id="${t.id}" ${pending?'disabled':''}>${pending?'In attesa':'Ho completato'}</button></div>
 </div>`;
}
function renderTasksPage(){
 const available=tasks.filter(t=>t.is_active&&t.target_type===currentMember.role&&(!t.assigned_member_id||t.assigned_member_id===currentMember.id));
 return headerCard()+`<div class="section-head"><h2>Faccende di casa</h2><span class="pill">${available.length} attività</span></div>
 <p class="sub">Scegli un'attività e inviala per la conferma dell'altro adulto.</p>
 ${available.map(taskCard).join('')||'<div class="empty">Nessuna attività disponibile.</div>'}
 <div class="section-head"><h2>Le mie attività inviate</h2></div>
 <div class="card">${myCompletions().map(c=>`<div class="member-row">
  <div class="row between"><strong>${esc(taskById(c.task_id)?.title||'Attività')}</strong><span class="pill ${c.status}">${statusLabel(c.status)}</span></div>
  ${c.status==='partial'?`<div class="actions"><button data-action="resubmit" data-id="${c.id}">Invia nuovamente</button></div>`:''}
 </div>`).join('')||'<p class="empty">Nessuna attività inviata.</p>'}</div>`;
}
async function submitTask(taskId){
 const task=taskById(taskId);
 if(!task||!task.is_active){notify('Attività non disponibile.');return;}
 if(task.target_type!==currentMember.role){notify('Attività non destinata al tuo profilo.');return;}
 if(task.assigned_member_id&&task.assigned_member_id!==currentMember.id){notify('Attività assegnata a un altro membro.');return;}
 if(completions.some(c=>c.task_id===taskId&&c.performed_by===currentMember.id&&c.status==='pending')){notify('Questa attività è già in attesa.');return;}
 await runAction(async()=>{
  const {error}=await db.rpc('submit_completion',{p_task_id:taskId});
  if(error)throw error;
 },'Attività inviata per la conferma!');
}

function renderReviewsPage(){
 if(!isAdult())return headerCard()+'<div class="card">Solo gli adulti possono esaminare le attività.</div>';
 const pending=completions.filter(c=>c.status==='pending'&&c.reviewer_member_id===currentMember.id);
 return headerCard()+`<div class="section-head"><h2>Da esaminare</h2><span class="pill pending">${pending.length} in attesa</span></div>
 <p class="sub">Puoi confermare solo le attività assegnate a te da verificare. Non puoi approvare le tue.</p>
 ${pending.map(c=>{
  const task=taskById(c.task_id);
  return `<div class="card">
   <h3>${esc(task?.title||'Attività')}</h3>
   <p class="sub">Inviata da ${esc(memberName(c.performed_by))}</p>
   <p>Valore: <strong>${Number(c.submitted_points??task?.points??0)} punti</strong></p>
   <label>Nota (facoltativa)</label><textarea id="note-${c.id}" placeholder="Scrivi una nota"></textarea>
   <div class="actions">
    <button data-action="review" data-id="${c.id}" data-decision="approved">Approva</button>
    <button class="btn-gold" data-action="review" data-id="${c.id}" data-decision="partial">Parziale</button>
    <button class="btn-danger" data-action="review" data-id="${c.id}" data-decision="rejected">Rifiuta</button>
   </div>
  </div>`;
 }).join('')||'<div class="empty">Non hai attività da esaminare.</div>'}`;
}
async function reviewTask(id,decision,note){
 const completion=completions.find(c=>c.id===id);
 if(!isAdult()||!completion){notify('Operazione non consentita.');return;}
 if(completion.performed_by===currentMember.id){notify('Non puoi approvare una tua attività.');return;}
 if(completion.reviewer_member_id!==currentMember.id){notify('Questa revisione è assegnata all’altro adulto.');return;}
 await runAction(async()=>{
  const {error}=await db.rpc('review_completion',{
   p_completion_id:id,p_decision:decision,p_review_note:note.trim()||null
  });
  if(error)throw error;
 },decision==='approved'?'Attività approvata!':decision==='partial'?'Attività parziale.':'Attività rifiutata.');
}
async function resubmitTask(id){
 const c=completions.find(x=>x.id===id);
 if(!c||c.performed_by!==currentMember.id||c.status!=='partial'){notify('Non puoi ripresentare questa attività.');return;}
 await runAction(async()=>{
  const {error}=await db.rpc('resubmit_completion',{p_completion_id:id});
  if(error)throw error;
 },'Attività inviata nuovamente!');
}
function completionCard(c){
 const date=c.reviewed_at||c.submitted_at;
 return `<div class="member-row">
  <div class="row between"><strong>${esc(taskById(c.task_id)?.title||'Attività')}</strong><span class="pill ${c.status}">${statusLabel(c.status)}</span></div>
  <div class="sub">Eseguita da ${esc(memberName(c.performed_by))}</div>
  <div class="sub">${date?new Date(date).toLocaleString('it-IT'):''}</div>
  <div>Punti assegnati: <strong>${Number(c.awarded_points)||0}</strong></div>
  ${c.review_note?`<div class="sub">Nota: ${esc(c.review_note)}</div>`:''}
 </div>`;
}
function renderRankingPage(){
 const ranking=[...members].sort((a,b)=>pointsBalance(b.id)-pointsBalance(a.id));
 return headerCard()+`<div class="section-head"><h2>Classifica familiare</h2></div>
 <div class="card">${ranking.map((m,i)=>`<div class="row between member-row">
  <div class="row"><div class="rank-number">${i+1}</div><strong>${esc(m.display_name)}</strong></div>
  <strong class="points">${pointsBalance(m.id)} punti</strong>
 </div>`).join('')}</div>
 <div class="section-head"><h2>Storico attività</h2></div>
 <div class="card">${completions.map(completionCard).join('')||'<p class="empty">Lo storico è ancora vuoto.</p>'}</div>
 <div class="section-head"><h2>Movimenti punti</h2></div>
 <div class="card">${ledger.slice(0,30).map(entry=>`<div class="member-row row between">
  <div><strong>${esc(memberName(entry.member_id))}</strong><div class="sub">${esc(entry.note||entry.entry_type)}</div></div>
  <strong>${entry.entry_type==='redeem'?'-':'+'}${Number(entry.points)||0}</strong>
 </div>`).join('')||'<p class="empty">Nessun movimento registrato.</p>'}</div>`;
}
function renderRewardsPage(){
 const available=rewards.filter(r=>r.is_active&&r.target_type===currentMember.role);
 return headerCard()+`<div class="section-head"><h2>Premi disponibili</h2></div>
 <p class="sub">Accumula punti e scegli insieme alla famiglia come festeggiare i traguardi.</p>
 ${available.map(r=>`<div class="card">
  <div class="row between"><h3>${esc(r.title)}</h3><span class="points">${Number(r.points_cost)||0} pt</span></div>

// RPC SUPABASE
async function createTask(data){
 const {error}=await db.rpc('create_task',{
  p_title:data.title,p_category:data.category||null,
  p_description:data.description||null,p_points:Number(data.points),
  p_target_type:data.target_type,p_assigned_member_id:data.assigned_member_id||null
 });
 if(error)throw error;
}
async function updateTask(id,data){
 const {error}=await db.rpc('update_task',{
  p_task_id:id,p_title:data.title,p_category:data.category||null,
  p_description:data.description||null,p_points:Number(data.points),
  p_assigned_member_id:data.assigned_member_id||null
 });
 if(error)throw error;
}
async function setTaskActive(id,active){
 const {error}=await db.rpc('set_task_active',{p_task_id:id,p_is_active:active});
 if(error)throw error;
}
async function createReward(data){
 const {error}=await db.rpc('create_reward',{
  p_title:data.title,p_description:data.description||null,
  p_points_cost:Number(data.points_cost),p_target_type:data.target_type
 });
 if(error)throw error;
}
async function updateReward(id,data){
 const {error}=await db.rpc('update_reward',{
  p_reward_id:id,p_title:data.title,p_description:data.description||null,
  p_points_cost:Number(data.points_cost)
 });
 if(error)throw error;
}
async function setRewardActive(id,active){
 const {error}=await db.rpc('set_reward_active',{p_reward_id:id,p_is_active:active});
 if(error)throw error;
}
async function runAction(action,successMessage){
 if(busy)return false;
 busy=true;
 try{
  await action();await loadData();render();
  if(successMessage)notify(successMessage);
  return true;
 }catch(error){
  console.error(error);notify('Operazione non riuscita: '+error.message);return false;
 }finally{busy=false;}
}

// EVENTI PULSANTI
$('app').addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const action=button.dataset.action,id=button.dataset.id;
 if(action==='logout'){await logout();return;}
 if(action==='theme-light'){setTheme('light');render();return;}
 if(action==='theme-dark'){setTheme('dark');render();return;}
 if(action==='submit-task'){await submitTask(id);return;}
 if(action==='resubmit'){await resubmitTask(id);return;}
 if(action==='review'){
  const note=$('note-'+id)?.value||'';
  await reviewTask(id,button.dataset.decision,note);return;
 }
 if(action==='toggle-task'){
  await runAction(()=>setTaskActive(id,button.dataset.active==='true'),
   button.dataset.active==='true'?'Attività riattivata.':'Attività disattivata.');return;
 }
 if(action==='toggle-reward'){
  await runAction(()=>setRewardActive(id,button.dataset.active==='true'),
   button.dataset.active==='true'?'Premio riattivato.':'Premio disattivato.');return;
 }
 if(action==='edit-task'){
  const t=taskById(id);if(!t)return;
  const title=prompt('Nome attività:',t.title);if(title===null)return;
  const category=prompt('Categoria:',t.category||'');if(category===null)return;
  const description=prompt('Descrizione:',t.description||'');if(description===null)return;
  const points=prompt('Punti:',t.points);
  if(points===null||!Number.isFinite(Number(points))||Number(points)<0){notify('Numero di punti non valido.');return;}
  await runAction(()=>updateTask(id,{title,category,description,points,assigned_member_id:t.assigned_member_id}),'Attività aggiornata.');return;
 }
 if(action==='edit-reward'){
  const r=rewardById(id);if(!r)return;
  const title=prompt('Nome premio:',r.title);if(title===null)return;
  const description=prompt('Descrizione:',r.description||'');if(description===null)return;
  const points=prompt('Costo in punti:',r.points_cost);
  if(points===null||!Number.isFinite(Number(points))||Number(points)<0){notify('Costo non valido.');return;}
  await runAction(()=>updateReward(id,{title,description,points_cost:points}),'Premio aggiornato.');
 }
});

// EVENTI MODULI
$('app').addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.target,data=Object.fromEntries(new FormData(form).entries());
 if(form.id==='taskForm'){
  if(!data.title.trim()||!Number.isFinite(Number(data.points))||Number(data.points)<0){notify('Controlla il nome e i punti.');return;}
  if(data.assigned_member_id){
   const selected=memberById(data.assigned_member_id);
   if(!selected||selected.role!==data.target_type){notify('Il membro assegnato deve avere il ruolo corretto.');return;}
  }
  await runAction(()=>createTask(data),'Attività creata.');return;
 }
 if(form.id==='rewardForm'){
  if(!data.title.trim()||!Number.isFinite(Number(data.points_cost))||Number(data.points_cost)<0){notify('Controlla il nome e il costo.');return;}
  await runAction(()=>createReward(data),'Premio creato.');
 }
});

$('loginForm').addEventListener('submit',login);
db.auth.onAuthStateChange((event,newSession)=>{
 if(event==='SIGNED_OUT'){
  stopRefresh();session=null;currentMember=null;showLogin();
 }
});
checkSession().catch(error=>{showLogin();notify('Errore di avvio: '+error.message);});
</script>
